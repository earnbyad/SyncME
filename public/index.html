<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncME — কন্ট্রোল প্যানেল</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <!-- ── গেট/লগইন ── -->
  <section id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-logo">
        <svg viewBox="0 0 80 80" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
          <polygon points="40,4 74,22 74,58 40,76 6,58 6,22"
                   fill="none" stroke="#00ffcc" stroke-width="2.5"/>
          <polygon points="40,14 64,27 64,53 40,66 16,53 16,27"
                   fill="none" stroke="#00ffcc" stroke-width="1.2" opacity="0.45"/>
          <circle cx="40" cy="40" r="11" fill="none" stroke="#00ffcc" stroke-width="2"/>
          <circle cx="40" cy="40" r="4" fill="#00ffcc"/>
          <line x1="40" y1="29" x2="40" y2="22" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="40" y1="51" x2="40" y2="58" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="30" y1="35" x2="24" y2="31" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="50" y1="45" x2="56" y2="49" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="30" y1="45" x2="24" y2="49" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="50" y1="35" x2="56" y2="31" stroke="#00ffcc" stroke-width="1.5"/>
          <circle cx="40" cy="22" r="2.5" fill="#ff2244"/>
          <circle cx="74" cy="22" r="2.5" fill="#ff2244"/>
          <circle cx="74" cy="58" r="2.5" fill="#ff2244"/>
          <circle cx="40" cy="76" r="2.5" fill="#ff2244"/>
          <circle cx="6"  cy="58" r="2.5" fill="#ff2244"/>
          <circle cx="6"  cy="22" r="2.5" fill="#ff2244"/>
        </svg>
      </div>
      <div class="gate-title">SYNCME</div>
      <div class="gate-sub">ডিভাইস কন্ট্রোল v1.0</div>
      <div class="gate-divider"></div>
      <label class="gate-label">OWNER ID</label>
      <input id="ownerInput" class="gate-input" type="text"
             placeholder="যেমন: mahmudul" autocomplete="off" spellcheck="false">
      <button id="gateEnter" class="btn btn-primary">⯈ কনসোলে যাও</button>
    </div>
  </section>

  <!-- ── মেইন কনসোল ── -->
  <div id="console" class="console hidden">

    <header class="topbar">
      <div class="brand">
        <span class="brand-accent">SYNC</span>ME
        <span class="brand-dim">/ control</span>
      </div>
      <div class="topbar-right">
        <span id="ownerBadge" class="owner-badge"></span>
        <span id="connState" class="conn-dot conn-connecting" title="সংযোগ অবস্থা"></span>
      </div>
    </header>

    <div class="layout">

      <!-- বাম দিক: ডিভাইস তালিকা -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>ডিভাইস</h2>
          <button id="pairBtn" class="btn btn-ghost btn-sm">+ পেয়ার করো</button>
        </div>
        <ul id="deviceList" class="device-list">
          <li class="device-empty">এখনো কোনো ডিভাইস নেই</li>
        </ul>
      </aside>

      <!-- ডান দিক: ভিউয়ার/স্ক্রিন দেখার অংশ -->
      <main class="viewer">
        <div id="viewerEmpty" class="viewer-empty">
          <div class="viewer-empty-mark">◌</div>
          <p>বাম দিক থেকে একটা ডিভাইস সিলেক্ট করো স্ক্রিন দেখতে</p>
        </div>

        <div id="viewerActive" class="viewer-active hidden">
          <div class="viewer-bar">
            <span id="viewerDeviceName" class="viewer-device-name"></span>
            <span id="viewerStatus" class="viewer-status">সংযোগ হচ্ছে...</span>
            <button id="disconnectBtn" class="btn btn-ghost btn-sm">বন্ধ করো</button>
          </div>
          <div class="video-wrap">
            <video id="remoteVideo" autoplay playsinline></video>
            <div id="videoOverlay" class="video-overlay"></div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- ── পেয়ারিং মডাল ── -->
  <div id="pairModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">নতুন ডিভাইস পেয়ার করো</div>
      <p class="modal-sub">এজেন্ট অ্যাপে দেখানো ৬-ডিজিট কোডটা লিখো</p>
      <input id="pairCodeInput" class="gate-input code-input"
             type="text" maxlength="6" placeholder="482913" autocomplete="off">
      <div id="pairError" class="pair-error hidden"></div>
      <div class="modal-actions">
        <button id="pairCancel" class="btn btn-ghost">বাতিল</button>
        <button id="pairSubmit" class="btn btn-primary">পেয়ার করো</button>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
