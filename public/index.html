<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncME — Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1320;
  --surface: #161C2C;
  --surface-raised: #1C2338;
  --border: #2A3350;
  --text: #E7EAF3;
  --text-dim: #8891AB;
  --text-faint: #5B6480;
  --accent: #45E0C4;
  --accent-dim: #2C8F7C;
  --danger: #E8637F;
  --warn: #E8B84B;
  --radius: 10px;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

.hidden { display: none !important; }

button {
  font-family: var(--sans);
  cursor: pointer;
}

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--border);
  background: var(--surface-raised);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--text-faint); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #08201B;
  font-weight: 600;
}
.btn-primary:hover { background: #5CEBD1; border-color: #5CEBD1; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ---------- Gate (owner sign-in) ---------- */
.gate {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gate-card {
  width: 340px;
  padding: 36px 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
}
.gate-mark {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: var(--accent);
  margin-bottom: 6px;
}
.gate-sub {
  color: var(--text-dim);
  font-size: 14px;
  margin: 0 0 20px;
}
.gate-input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  margin-bottom: 14px;
  outline: none;
}
.gate-input:focus { border-color: var(--accent); }
.gate-input::placeholder { color: var(--text-faint); }
.gate-card .btn { width: 100%; }

/* ---------- Console shell ---------- */
.console { height: 100vh; display: flex; flex-direction: column; }

.topbar {
  height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.brand { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.brand-dim { color: var(--text-faint); font-weight: 400; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.owner-badge {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--surface-raised);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.conn-dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block;
}
.conn-connecting { background: var(--warn); animation: pulse 1.4s infinite ease-in-out; }
.conn-online { background: var(--accent); }
.conn-offline { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.layout { flex: 1; display: flex; min-height: 0; }

/* ---------- Sidebar / device list ---------- */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.sidebar-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 10px;
}
.sidebar-head h2 {
  font-size: 13px;
  text-transform: none;
  color: var(--text-dim);
  font-weight: 600;
  margin: 0;
}
.device-list { list-style: none; margin: 0; padding: 4px 8px; overflow-y: auto; }
.device-empty {
  color: var(--text-faint);
  font-size: 13px;
  padding: 20px 8px;
  text-align: center;
}
.device-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.device-item:hover { background: var(--surface-raised); }
.device-item.active {
  background: var(--surface-raised);
  border-color: var(--accent-dim);
}
.device-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.device-dot.online { background: var(--accent); }
.device-dot.offline { background: var(--text-faint); }
.device-dot.unpaired { background: var(--warn); }
.device-meta { min-width: 0; }
.device-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.device-sub {
  font-size: 12px;
  color: var(--text-faint);
  font-family: var(--mono);
}

/* ---------- Viewer ---------- */
.viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.viewer-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  gap: 10px;
}
.viewer-empty-mark { font-size: 32px; color: var(--text-faint); }
.viewer-empty p { font-size: 14px; margin: 0; }

.viewer-active { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.viewer-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}
.viewer-device-name { font-weight: 600; font-size: 14px; }
.viewer-status {
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--mono);
  flex: 1;
}
.video-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05070C;
  position: relative;
  overflow: hidden;
}
#remoteVideo {
  max-width: 100%;
  max-height: 100%;
  cursor: crosshair;
}
.video-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.tap-ripple {
  position: absolute;
  width: 24px; height: 24px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: ripple .5s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple {
  from { opacity: .9; transform: translate(-50%, -50%) scale(.4); }
  to { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
}

/* ---------- Pairing modal ---------- */
.modal {
  position: fixed; inset: 0;
  background: rgba(5, 7, 12, .7);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
}
.modal-card {
  width: 320px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}
.modal-card h3 { margin: 0 0 6px; font-size: 16px; }
.modal-sub { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
.modal-card .gate-input {
  text-align: center;
  font-size: 22px;
  letter-spacing: 6px;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.pair-error {
  color: var(--danger);
  font-size: 13px;
  margin: -6px 0 12px;
}

@media (max-width: 720px) {
  .sidebar { width: 220px; }
}
</style>
</head>
<body>

<div class="shell">

  <!-- Owner sign-in gate -->
  <section id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-mark">SyncME</div>
      <p class="gate-sub">তোমার owner ID দিয়ে কন্ট্রোল প্যানেলে ঢোকো</p>
      <input id="ownerInput" class="gate-input" type="text" placeholder="owner id, যেমন: mahmudul" autocomplete="off">
      <button id="gateEnter" class="btn btn-primary">প্যানেলে যাও</button>
    </div>
  </section>

  <!-- Main console -->
  <div id="console" class="console hidden">

    <header class="topbar">
      <div class="brand">SyncME <span class="brand-dim">/ control</span></div>
      <div class="topbar-right">
        <span id="ownerBadge" class="owner-badge"></span>
        <span id="connState" class="conn-dot conn-connecting" title="connection status"></span>
      </div>
    </header>

    <div class="layout">

      <!-- Left: device list -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>ডিভাইস</h2>
          <button id="pairBtn" class="btn btn-ghost btn-sm">+ পেয়ার করো</button>
        </div>
        <ul id="deviceList" class="device-list">
          <li class="device-empty">কোনো ডিভাইস নেই এখনো</li>
        </ul>
      </aside>

      <!-- Right: viewer -->
      <main class="viewer">
        <div id="viewerEmpty" class="viewer-empty">
          <div class="viewer-empty-mark">◌</div>
          <p>বাম দিক থেকে একটা ডিভাইস সিলেক্ট করো স্ক্রিন দেখতে</p>
        </div>

        <div id="viewerActive" class="viewer-active hidden">
          <div class="viewer-bar">
            <span id="viewerDeviceName" class="viewer-device-name"></span>
            <span id="viewerStatus" class="viewer-status">সংযোগ হচ্ছে...</span>
            <button id="disconnectBtn" class="btn btn-ghost btn-sm">বন্ধ করো</button>
          </div>
          <div class="video-wrap">
            <video id="remoteVideo" autoplay playsinline></video>
            <div id="videoOverlay" class="video-overlay"></div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Pairing modal -->
  <div id="pairModal" class="modal hidden">
    <div class="modal-card">
      <h3>নতুন ডিভাইস পেয়ার করো</h3>
      <p class="modal-sub">এজেন্ট অ্যাপে দেখানো ৬-ডিজিট কোডটা লিখো</p>
      <input id="pairCodeInput" class="gate-input" type="text" maxlength="6" placeholder="482913" autocomplete="off">
      <div id="pairError" class="pair-error hidden"></div>
      <div class="modal-actions">
        <button id="pairCancel" class="btn btn-ghost">বাতিল</button>
        <button id="pairSubmit" class="btn btn-primary">পেয়ার করো</button>
      </div>
    </div>
  </div>

</div>

<script>
// ---------- State ----------
let ws = null;
let ownerId = null;
let myDeviceId = null;
let devices = [];
let activeDeviceId = null;
let pc = null;          // RTCPeerConnection to the currently viewed agent
let dataChannel = null;
let reconnectAttempt = 0;

const els = {
  gate: document.getElementById('gate'),
  ownerInput: document.getElementById('ownerInput'),
  gateEnter: document.getElementById('gateEnter'),
  console: document.getElementById('console'),
  ownerBadge: document.getElementById('ownerBadge'),
  connState: document.getElementById('connState'),
  deviceList: document.getElementById('deviceList'),
  pairBtn: document.getElementById('pairBtn'),
  pairModal: document.getElementById('pairModal'),
  pairCodeInput: document.getElementById('pairCodeInput'),
  pairError: document.getElementById('pairError'),
  pairSubmit: document.getElementById('pairSubmit'),
  pairCancel: document.getElementById('pairCancel'),
  viewerEmpty: document.getElementById('viewerEmpty'),
  viewerActive: document.getElementById('viewerActive'),
  viewerDeviceName: document.getElementById('viewerDeviceName'),
  viewerStatus: document.getElementById('viewerStatus'),
  remoteVideo: document.getElementById('remoteVideo'),
  videoOverlay: document.getElementById('videoOverlay'),
  disconnectBtn: document.getElementById('disconnectBtn'),
};

// ---------- Owner gate ----------
const savedOwner = localStorage.getItem('syncme_owner_id');
if (savedOwner) {
  els.ownerInput.value = savedOwner;
}

els.gateEnter.addEventListener('click', enterConsole);
els.ownerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') enterConsole(); });

function enterConsole() {
  const val = els.ownerInput.value.trim();
  if (!val) return;
  ownerId = val;
  localStorage.setItem('syncme_owner_id', val);
  els.gate.classList.add('hidden');
  els.console.classList.remove('hidden');
  els.ownerBadge.textContent = ownerId;
  connect();
}

// ---------- WebSocket signaling ----------
function connect() {
  setConnState('connecting');
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.addEventListener('open', () => {
    reconnectAttempt = 0;
    send({
      type: 'register_controller',
      ownerId,
      deviceName: 'Control Panel (Web)',
      platform: 'web',
    });
  });

  ws.addEventListener('message', (event) => {
    const msg = JSON.parse(event.data);
    handleMessage(msg);
  });

  ws.addEventListener('close', () => {
    setConnState('offline');
    scheduleReconnect();
  });

  ws.addEventListener('error', () => {
    setConnState('offline');
  });
}

function scheduleReconnect() {
  reconnectAttempt++;
  const delay = Math.min(2 * reconnectAttempt, 30) * 1000;
  setTimeout(connect, delay);
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function setConnState(state) {
  els.connState.className = 'conn-dot conn-' + state;
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'registered':
      myDeviceId = msg.deviceId;
      setConnState('online');
      devices = msg.devices || [];
      renderDeviceList();
      break;

    case 'pair_success':
      myDeviceId = msg.deviceId || myDeviceId;
      devices = msg.devices || devices;
      renderDeviceList();
      closePairModal();
      break;

    case 'pair_failed':
      showPairError(msg.reason === 'invalid_or_expired_code'
        ? 'কোড সঠিক নয় বা মেয়াদ শেষ হয়ে গেছে।'
        : 'পেয়ারিং ব্যর্থ হয়েছে।');
      break;

    case 'device_list':
      devices = msg.devices || [];
      renderDeviceList();
      break;

    case 'device_status':
      updateDeviceStatus(msg.deviceId, msg.status);
      break;

    case 'webrtc_answer':
      if (pc) pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      break;

    case 'webrtc_ice_candidate':
      if (pc) {
        pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
      }
      break;

    case 'error':
      console.warn('Server error:', msg);
      break;
  }
}

// ---------- Device list rendering ----------
function renderDeviceList() {
  const agents = devices.filter(d => d.role === 'agent');

  if (agents.length === 0) {
    els.deviceList.innerHTML = '<li class="device-empty">কোনো ডিভাইস নেই এখনো</li>';
    return;
  }

  els.deviceList.innerHTML = '';
  agents.forEach(dev => {
    const li = document.createElement('li');
    li.className = 'device-item' + (dev.deviceId === activeDeviceId ? ' active' : '');
    li.dataset.deviceId = dev.deviceId;

    const dotClass = dev.status === 'online' ? 'online' : (dev.status === 'unpaired' ? 'unpaired' : 'offline');
    const statusLabel = dev.status === 'online' ? 'অনলাইন' : (dev.status === 'unpaired' ? 'পেয়ার হয়নি' : 'অফলাইন');

    li.innerHTML = `
      <span class="device-dot ${dotClass}"></span>
      <div class="device-meta">
        <div class="device-name">${escapeHtml(dev.deviceName || 'Unknown Device')}</div>
        <div class="device-sub">${statusLabel}</div>
      </div>
    `;
    li.addEventListener('click', () => selectDevice(dev));
    els.deviceList.appendChild(li);
  });
}

function updateDeviceStatus(deviceId, status) {
  const dev = devices.find(d => d.deviceId === deviceId);
  if (dev) dev.status = status;
  renderDeviceList();
  if (deviceId === activeDeviceId) {
    els.viewerStatus.textContent = status === 'online' ? 'সংযুক্ত' : 'সংযোগ বিচ্ছিন্ন';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Pairing modal ----------
els.pairBtn.addEventListener('click', () => {
  els.pairModal.classList.remove('hidden');
  els.pairCodeInput.value = '';
  els.pairError.classList.add('hidden');
  els.pairCodeInput.focus();
});
els.pairCancel.addEventListener('click', closePairModal);
els.pairSubmit.addEventListener('click', submitPairCode);
els.pairCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPairCode(); });

function closePairModal() {
  els.pairModal.classList.add('hidden');
}

function submitPairCode() {
  const code = els.pairCodeInput.value.trim();
  if (code.length !== 6) {
    showPairError('৬-ডিজিটের কোড দাও।');
    return;
  }
  send({ type: 'pair_with_code', pairingCode: code });
}

function showPairError(text) {
  els.pairError.textContent = text;
  els.pairError.classList.remove('hidden');
}

// ---------- Device selection + WebRTC viewer ----------
function selectDevice(dev) {
  if (dev.deviceId === activeDeviceId) return;
  teardownPeerConnection();
  activeDeviceId = dev.deviceId;
  renderDeviceList();

  els.viewerEmpty.classList.add('hidden');
  els.viewerActive.classList.remove('hidden');
  els.viewerDeviceName.textContent = dev.deviceName || 'Unknown Device';
  els.viewerStatus.textContent = 'সংযোগ হচ্ছে...';

  startViewing(dev.deviceId);
}

async function startViewing(targetDeviceId) {
  pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: 'webrtc_ice_candidate',
        targetDeviceId,
        candidate: {
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        },
      });
    }
  };

  pc.ontrack = (event) => {
    els.remoteVideo.srcObject = event.streams[0];
    els.viewerStatus.textContent = 'সংযুক্ত';
  };

  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === 'disconnected' || pc.connectionState === 'failed')) {
      els.viewerStatus.textContent = 'সংযোগ বিচ্ছিন্ন';
    }
  };

  dataChannel = pc.createDataChannel('remote_input');
  dataChannel.onopen = () => console.log('data channel open');

  const offer = await pc.createOffer({ offerToReceiveVideo: true });
  await pc.setLocalDescription(offer);

  send({
    type: 'webrtc_offer',
    targetDeviceId,
    sdp: { sdp: offer.sdp, type: offer.type },
  });
}

function teardownPeerConnection() {
  if (dataChannel) { dataChannel.close(); dataChannel = null; }
  if (pc) { pc.close(); pc = null; }
  els.remoteVideo.srcObject = null;
}

els.disconnectBtn.addEventListener('click', () => {
  teardownPeerConnection();
  activeDeviceId = null;
  els.viewerActive.classList.add('hidden');
  els.viewerEmpty.classList.remove('hidden');
  renderDeviceList();
});

// ---------- Remote input: click on video -> tap event over data channel ----------
els.remoteVideo.addEventListener('click', (e) => {
  if (!dataChannel || dataChannel.readyState !== 'open') return;

  const rect = els.remoteVideo.getBoundingClientRect();
  const xNorm = (e.clientX - rect.left) / rect.width;
  const yNorm = (e.clientY - rect.top) / rect.height;

  dataChannel.send(JSON.stringify({
    kind: 'tap',
    x: xNorm,
    y: yNorm,
  }));

  showTapRipple(e.clientX - rect.left, e.clientY - rect.top);
});

function showTapRipple(x, y) {
  const ripple = document.createElement('div');
  ripple.className = 'tap-ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  els.videoOverlay.appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);
}

console.log('SyncME Control Panel loaded');
</script>

</body>
</html>
